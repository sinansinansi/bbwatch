name: bbwatch

on:
  schedule:
    # Hourly keeps a private repo at ~720 of the 2000 free Actions minutes/month.
    # For every 30 min use "15,45 * * * *" (~1440 min/month).
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Only send a test notification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: bbwatch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BBWATCH_MIN_BOUNTY: ${{ vars.BBWATCH_MIN_BOUNTY || '0' }}
      BBWATCH_BOUNTY_ONLY: ${{ vars.BBWATCH_BOUNTY_ONLY || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test alert
        if: inputs.test_alert
        run: python bbwatch.py --test-alert
      - name: Diff programs
        if: ${{ !inputs.test_alert }}
        run: python bbwatch.py
      - name: Commit snapshot
        if: ${{ !inputs.test_alert }}
        run: |
          git config user.name bbwatch
          git config user.email bbwatch@users.noreply.github.com
          git add state.json reports/
          git diff --cached --quiet || git commit -m "bbwatch $(date -u +%F_%H%M)"
          git push
